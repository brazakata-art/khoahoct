.nav{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:13px 0}.nav button{background:#102238;color:var(--text);border:1px solid var(--line)}.nav button.active{background:var(--accent);color:#06101c}.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.menu button{text-align:left;padding:16px;background:linear-gradient(135deg,#173762,#0e1e33);color:var(--text);border:1px solid var(--line)}.menu strong{display:block;font-size:18px;margin-bottom:5px}.menu span{font-size:12px;color:#bfd0e6}
.progress{height:10px;background:#06101b;border:1px solid var(--line);border-radius:999px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#5aa9ff,#8ae6ff)}.hp{height:14px;background:#260e16;border-radius:999px;overflow:hidden}.hp>div{height:100%;background:linear-gradient(90deg,#fb7185,#ef4444)}.shield{height:10px;background:#0c2632;border-radius:999px;overflow:hidden}.shield>div{height:100%;background:linear-gradient(90deg,#22d3ee,#38bdf8)}
.diffCard,.shopItem,.petCard,.equipCard,.bossCard,.worldBossCard{background:#091624;border:1px solid var(--line);border-radius:15px;padding:13px}.diffCard{cursor:pointer}.diffCard:hover,.bossCard:hover,.worldBossCard:hover{border-color:#4f78a2;transform:translateY(-1px)}.diffCard.locked{opacity:.5;cursor:not-allowed}.quest{font-size:22px;font-weight:850;line-height:1.4;margin:14px 0}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.answers button{background:#12283f;color:var(--text);border:1px solid #365676;text-align:left}.answers button:hover{background:#1b3858}.log{max-height:220px;overflow:auto;background:#06101b;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:13px}.log div{padding:4px 0;border-bottom:1px solid #122338}.log div:last-child{border-bottom:0}
.shopGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #19304a}.item:last-child{border-bottom:0}.rarity{font-weight:900}.r-common{color:#fff}.r-uncommon{color:#4ade80}.r-rare{color:#60a5fa}.r-epic{color:#c084fc}.r-legendary{color:#fb923c}.r-gold{color:#facc15}.r-divine{color:#67e8f9}.r-mythic{color:#f43f5e}.r-ultimate{color:#f9a8ff;text-shadow:0 0 8px #a855f7}.r-black{color:#e879f9;text-shadow:0 0 6px #8b5cf6}.equipmentRow{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.gearIcon{font-size:30px}.gearMeta{display:flex;justify-content:space-between;gap:8px;align-items:center}.modal{position:fixed;inset:0;background:rgba(0,0,0,.68);display:grid;place-items:center;padding:15px;z-index:30}.modalBox{width:min(560px,100%);background:#0d1828;border:1px solid var(--line);border-radius:18px;padding:18px}.toast{position:fixed;right:16px;bottom:16px;background:#112840;border:1px solid #3b6289;padding:11px 15px;border-radius:12px;display:none;z-index:40}.notice{padding:10px 12px;border-radius:12px;background:#122338;border:1px solid #27425e}.warning{border-color:#815c19;background:#2a2110}.bossArt{font-size:50px;width:76px;height:76px;border-radius:18px;background:#121f34;display:grid;place-items:center}.twoCol{display:grid;grid-template-columns:1.25fr .75fr;gap:12px}.miniList{display:grid;gap:8px}.miniList>div{padding:8px 10px;border-radius:10px;background:#0b1a2b;border:1px solid #1c3550}
@media(max-width:950px){.grid4,.grid,.grid2,.shopGrid,.menu,.equipmentRow,.twoCol{grid-template-columns:1fr 1fr}.nav{grid-template-columns:repeat(4,1fr)}}
@media(max-width:650px){.grid4,.grid,.grid2,.shopGrid,.menu,.equipmentRow,.twoCol,.answers{grid-template-columns:1fr}.nav{grid-template-columns:repeat(3,1fr)}.top{align-items:flex-start;flex-direction:column}}

<script>
(()=>{
const KEY='khtn_single_html_v3_cloud';
/*
  CLOUD SETUP
  1) Create a Supabase project.
  2) Put the Project URL and Publishable/Anon key below.
  3) Run the companion SQL file: supabase_khtn.sql
  Never put a Supabase service_role/secret key in this HTML.
*/
const SUPABASE_CONFIG={
  url:'https://YOUR-PROJECT.supabase.co',
  key:'YOUR_SUPABASE_PUBLISHABLE_OR_ANON_KEY'
};
const CLOUD_CONFIGURED=SUPABASE_CONFIG.url.startsWith('https://') && !SUPABASE_CONFIG.url.includes('YOUR-PROJECT') && SUPABASE_CONFIG.key && !SUPABASE_CONFIG.key.includes('YOUR_SUPABASE');
const supa=CLOUD_CONFIGURED && window.supabase ? window.supabase.createClient(SUPABASE_CONFIG.url,SUPABASE_CONFIG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}):null;
let cloudChannel=null,cloudSaveTimer=null,cloudSaving=false,cloudSaveQueued=false;
let roomChannel=null,roomUiTimer=null,roomJoinInProgress=false;
const DEVICE_KEY='khtn_device_id_v1';
const deviceId=localStorage.getItem(DEVICE_KEY)||('dev_'+Math.random().toString(36).slice(2)+'_'+Date.now().toString(36));
localStorage.setItem(DEVICE_KEY,deviceId);
const DIFFICULTIES=[
{id:'easy',name:'Khởi đầu',color:'r-common',icon:'🌱',desc:'Câu hỏi nền tảng, phép toán trực tiếp.',unlock:1,hpMul:1,atkMul:1,defMul:1},
{id:'normal',name:'Tiến bước',color:'r-uncommon',icon:'🧩',desc:'Bẫy phương án, cần suy luận 2 bước.',unlock:10,hpMul:1.35,atkMul:1.15,defMul:1.15},
{id:'hard',name:'Chuyên sâu',color:'r-rare',icon:'🧠',desc:'Bài toán nhiều bước, phản ứng hóa học phức tạp hơn.',unlock:25,hpMul:1.8,atkMul:1.35,defMul:1.3},
{id:'expert',name:'Thách thức',color:'r-epic',icon:'⚡',desc:'Câu đố đánh lừa cao, yêu cầu kiểm tra kỹ điều kiện.',unlock:45,hpMul:2.35,atkMul:1.6,defMul:1.5}
];
const TOPICS={Toán:['Phương trình bậc hai','Định lý Viète','Delta và nghiệm','Biện luận nghiệm'],Hóa:['Cân bằng phương trình hóa học','Bảo toàn nguyên tố','Phản ứng axit–bazơ','Oxi hóa–khử cơ bản']};
const RARITIES=[
{id:'common',name:'Phổ thông',short:'Trắng',className:'r-common',mult:1.00,shopEquip:true,black:false,drop:50},
{id:'uncommon',name:'Hiếm',short:'Lục',className:'r-uncommon',mult:1.35,shopEquip:true,black:true,drop:35},
{id:'rare',name:'Cực Hiếm',short:'Lam',className:'r-rare',mult:1.8,shopEquip:true,black:false,drop:15},
{id:'epic',name:'Sử thi',short:'Tím',className:'r-epic',mult:2.4,shopEquip:true,black:false,drop:5},
{id:'legendary',name:'Huyền thoại',short:'Cam',className:'r-legendary',mult:3.2,shopEquip:false,black:true,drop:3.0},
{id:'gold',name:'Hoàng Kim',short:'Vàng',className:'r-gold',mult:4.2,shopEquip:false,black:true,drop:2.0},
{id:'divine',name:'Thần',short:'Xanh ánh kim',className:'r-divine',mult:5.5,shopEquip:false,black:true,drop:1.4},
{id:'mythic',name:'Thần thoại',short:'Đỏ',className:'r-mythic',mult:7.0,shopEquip:false,black:true,drop:1.0},
{id:'ultimate',name:'Tối thượng',short:'Cầu vồng',className:'r-ultimate',mult:9.5,shopEquip:false,black:true,drop:.5},
{id:'black',name:'Black Holes',short:'Đen-Tím',className:'r-black',mult:14,shopEquip:false,black:true,drop:.01}
];
const EQUIP_TYPES=[
{id:'weapon',name:'Vũ khí',icon:'⚔️',bias:{atk:1,hp:0,def:0,crit:.01,critDmg:0}},
{id:'helmet',name:'Mũ',icon:'🪖',bias:{atk:.15,hp:.8,def:.6,crit:.002,critDmg:.03}},
{id:'armor',name:'Áo',icon:'🛡️',bias:{atk:.12,hp:1,def:.9,crit:.001,critDmg:.02}},
{id:'pants',name:'Quần',icon:'👖',bias:{atk:.1,hp:.8,def:.8,crit:.001,critDmg:.01}},
{id:'boots',name:'Giày',icon:'🥾',bias:{atk:.1,hp:.6,def:.55,crit:.003,critDmg:.03}},
{id:'talent',name:'Thiên phú',icon:'✨',bias:{atk:.2,hp:.9,def:.5,crit:.004,critDmg:.05}},
{id:'jewelry',name:'Trang sức',icon:'💍',bias:{atk:.25,hp:.5,def:.25,crit:.005,critDmg:.06}}
];
const QUESTIONS={
Toán:[
{q:'Phương trình x² − 5x + 6 = 0 có hai nghiệm là?',a:['1 và 6','2 và 3','−2 và −3','0 và 6'],c:1},
{q:'Phương trình 2x² − 7x + 3 = 0 có tổng hai nghiệm bằng?',a:['−7/2','3/2','7/2','−3/2'],c:2},
{q:'Phương trình x² + 4x + 5 = 0 có số nghiệm thực là?',a:['0','1','2','4'],c:0},
{q:'Với ax²+bx+c=0, a≠0, nếu Δ=0 thì phương trình có?',a:['Vô nghiệm','Một nghiệm kép','Hai nghiệm phân biệt','Hai nghiệm đối nhau'],c:1},
{q:'Phương trình x²−4x+4=0 có nghiệm x bằng?',a:['−2','0','2','4'],c:2},
{q:'Nếu hai nghiệm là x₁=2, x₂=−3 thì tổng hai nghiệm bằng?',a:['−6','−1','1','6'],c:1},
{q:'Phương trình 3x²−12x=0 có nghiệm là?',a:['0 và 4','3 và 4','−4 và 0','1 và 4'],c:0},
{q:'Với x²+bx+c=0 có hai nghiệm dương, điều kiện cần là?',a:['b>0,c<0','b<0,c>0','b>0,c>0','b<0,c<0'],c:1}
],
Hóa:[
{q:'Cân bằng: ?H₂ + O₂ → ?H₂O. Bộ hệ số tối giản là?',a:['1,1,1','2,1,2','2,2,1','1,2,2'],c:1},
{q:'Cân bằng: Fe + O₂ → Fe₂O₃. Hệ số tối giản là?',a:['2,3,1','4,3,2','3,2,1','4,2,3'],c:1},
{q:'Cân bằng: Al + HCl → AlCl₃ + H₂. Hệ số tối giản là?',a:['1,3,1,1','2,6,2,3','2,3,2,3','1,6,1,3'],c:1},
{q:'Cân bằng: NaOH + H₂SO₄ → Na₂SO₄ + H₂O. Hệ số tối giản là?',a:['1,1,1,1','2,1,1,2','1,2,1,2','2,2,1,1'],c:1},
{q:'Cân bằng: CaCO₃ → CaO + CO₂. Hệ số tối giản là?',a:['2,1,1','1,1,1','1,2,1','1,1,2'],c:1},
{q:'Cân bằng: CH₄ + O₂ → CO₂ + H₂O. Hệ số tối giản là?',a:['1,1,1,1','1,2,1,2','2,1,2,1','2,4,2,4'],c:1},
{q:'Cân bằng: Mg + HCl → MgCl₂ + H₂. Hệ số tối giản là?',a:['1,1,1,1','1,2,1,1','2,1,2,1','2,2,1,1'],c:1},
{q:'Cân bằng: N₂ + H₂ → NH₃. Hệ số tối giản là?',a:['1,1,1','1,2,2','1,3,2','2,3,2'],c:2}
]};
const WORLD_BOSSES=[
{name:'Tân Tinh Toán',tier:1,hp:10000,icon:'🌑',desc:'Khởi đầu – suy luận vừa phải'},
{name:'Hóa Nguyên Sơ',tier:2,hp:100000,icon:'🧪',desc:'Cân bằng phản ứng nâng cao'},
{name:'Quái Vật Viète',tier:3,hp:1000000,icon:'📐',desc:'Bẫy nghiệm và điều kiện'},
{name:'Lò Phản Ứng Khổng Lồ',tier:4,hp:10000000,icon:'⚗️',desc:'Hóa học nhiều tầng'},
{name:'Hắc Delta',tier:5,hp:100000000,icon:'🕳️',desc:'Suy luận hỗn hợp'},
{name:'Pháo Đài Bảo Toàn',tier:6,hp:1000000000,icon:'🏰',desc:'Bảo toàn nguyên tố & đại số'},
{name:'Thiên Thể Phương Trình',tier:7,hp:10000000000,icon:'🌌',desc:'Đa bước tốc độ cao'},
{name:'Đại Hóa Thần',tier:8,hp:100000000000,icon:'👁️',desc:'Câu hỏi đánh lừa mạnh'},
{name:'Kẻ Ăn Mòn Hằng Số',tier:9,hp:1000000000000,icon:'☄️',desc:'Mốc tối thượng – cơ hội Black Holes 0,01%'},
{name:'Kẻ Thách Thức Hư Không',tier:10,hp:10000000000000,icon:'🌀',desc:'Cực hạn của Boss Thế giới'}
];
const SOLO_DROPS={common:50,uncommon:28,rare:12,epic:7,legendary:2,gold:.7,divine:.25,mythic:.04,ultimate:.01};
let state={user:null,screen:'home',playType:null,mode:null,subject:null,diff:null,stage:null,enemyIndex:0,playerHP:100,enemyHP:0,enemyMax:0,boss:false,logs:[],question:null,room:null,worldBoss:null};
function defaultUser(username){return {username,name:'Kẻ thách thức',renameUsed:false,level:1,xp:0,coin:500,gem:50,inv:{revive:2},equipment:{},pets:[],pet:null,progress:{Toán:{easy:0,normal:0,hard:0,expert:0},Hóa:{easy:0,normal:0,hard:0,expert:0}},world:{monthKey:getMonthKey(),attempts:{},damageHits:{},claimedHits:{},clears:{}},starterGift:false,createdAt:Date.now()}}
function db(){try{return JSON.parse(localStorage.getItem(KEY))||{users:{}}}catch(e){return {users:{}}}}
function saveDB(d){localStorage.setItem(KEY,JSON.stringify(d))}
function u(){const d=db();return state.user?d.users[state.user]:null}
function cloudSanitize(x){const y=JSON.parse(JSON.stringify(x||{}));delete y.password;return y}
function cacheCurrentUser(x){const d=db();d.users[state.user]=cloudSanitize(x);saveDB(d)}
function queueCloudSave(){if(!supa||!state.user)return;clearTimeout(cloudSaveTimer);cloudSaveTimer=setTimeout(()=>saveCloudNow(),350)}
async function saveCloudNow(){
  if(!supa||!state.user)return;
  const x=u();if(!x)return;
  if(cloudSaving){cloudSaveQueued=true;return}
  cloudSaving=true;
  const payload={id:state.user,username:x.username||'',display_name:x.name||'Kẻ thách thức',game_state:cloudSanitize(x),updated_at:new Date().toISOString()};
  const {error}=await supa.from('profiles').upsert(payload,{onConflict:'id'});
  cloudSaving=false;
  if(error){cloudSaveQueued=false;toast('⚠️ Chưa đồng bộ Cloud: '+error.message);return}
  if(cloudSaveQueued){cloudSaveQueued=false;saveCloudNow()}
}
function patchUser(p){const d=db();if(!state.user||!d.users[state.user])return;d.users[state.user]={...d.users[state.user],...p};saveDB(d);queueCloudSave()}
function getMonthKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function resetWorldIfNeeded(){const x=u();if(!x)return;if(x.world?.monthKey!==getMonthKey()){x.world={monthKey:getMonthKey(),attempts:{},damageHits:{},claimedHits:{},clears:{}};patchUser({world:x.world})}}
async function hydrateFromCloud(authUser){
  state.user=authUser.id;
  let profile=null;
  if(supa){
    const {data,error}=await supa.from('profiles').select('id,username,display_name,game_state,updated_at').eq('id',authUser.id).maybeSingle();
    if(error){console.warn('Cloud profile read error',error);}
    profile=data||null;
  }
  if(profile?.game_state){
    const cloudState={...profile.game_state,username:profile.username||authUser.email||profile.game_state.username||'player'};
    const d=db();d.users[state.user]=cloudSanitize(cloudState);saveDB(d);
  }else{
    const existing=db().users[state.user];
    const fresh=existing||defaultUser(authUser.email||'player');
    fresh.username=authUser.email||fresh.username||'player';
    cacheCurrentUser(fresh);
    await saveCloudNow();
  }
  resetWorldIfNeeded();
  subscribeCloudProfile();
  const invite=parseInviteRoom();
  if(invite && !state.room){
    state.playType='network';
    state.screen='networkLobby';
    setTimeout(()=>joinNetworkRoom(),120);
  }
  render();
}
function subscribeCloudProfile(){
  if(!supa||!state.user)return;
  if(cloudChannel){try{supa.removeChannel(cloudChannel)}catch(e){}}
  cloudChannel=supa.channel('khtn-profile-'+state.user).on('postgres_changes',{event:'UPDATE',schema:'public',table:'profiles',filter:'id=eq.'+state.user},payload=>{
    if(!payload?.new?.game_state||payload.new.id!==state.user)return;
    const d=db();
    d.users[state.user]=cloudSanitize(payload.new.game_state);
    d.users[state.user].username=payload.new.username||d.users[state.user].username;
    saveDB(d);
    if(state.user){toast('☁️ Dữ liệu đã được đồng bộ từ Cloud');render();}
  }).subscribe();
}
async function bootCloud(){
  if(!supa){render();return}
  const {data,error}=await supa.auth.getSession();
  if(error){console.warn('Auth session error',error);render();return}
  if(data?.session?.user){await hydrateFromCloud(data.session.user)} else render();
  supa.auth.onAuthStateChange(async (_event,session)=>{
    if(session?.user && state.user!==session.user.id){await hydrateFromCloud(session.user)}
    if(!session){state={...state,user:null,screen:'home'};render()}
  });
}
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function toast(msg){const e=document.getElementById('toast');e.textContent=msg;e.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.style.display='none',2200)}
function modal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')};window.closeModal=closeModal;
function chooseScreen(s){if(state.room&&s!=='networkLobby')leaveNetworkRoom();state.screen=s;state.playType=null;state.mode=null;state.subject=null;state.diff=null;state.stage=null;state.room=null;state.worldBoss=null;render()};
function choosePlayType(t){state.playType=t;state.screen='modeSelect';render()};window.choosePlayType=choosePlayType;window.chooseScreen=chooseScreen;
async function login(){
  const a=document.getElementById('loginUser')?.value.trim(),p=document.getElementById('loginPw')?.value;
  if(!a||!p)return toast('Nhập tài khoản và mật khẩu');
  if(!supa)return toast('Cloud chưa cấu hình. Hãy điền SUPABASE_CONFIG ở đầu file.');
  const {data,error}=await supa.auth.signInWithPassword({email:a,password:p});
  if(error)return toast('Đăng nhập thất bại: '+error.message);
  if(data?.user) await hydrateFromCloud(data.user);
}
window.login=login;
async function register(){
  if(state.user)return toast('Tài khoản hiện tại đã đăng nhập. Hãy đăng xuất trước khi tạo tài khoản mới.');

async function connectNetworkRoom(code,isHost=false,mode=null){

  roomChannel=supa.channel('khtn-room-'+code,{config:{presence:{key:state.user+'-'+deviceId},broadcast:{ack:true}}});
  roomChannel.on('presence',{event:'sync'},()=>{state.room.players=roomRoster().map(p=>p.name);scheduleRoomUi()});

        state.room.connected=true;state.room.mode=mode||state.room.mode;state.mode=mode||state.mode||'expedition';
        await roomChannel.track(publicPlayerSnapshot());

const SHOP_TYPES=[{id:'equip',name:'🛡️ Cửa hàng trang bị',refresh:'30 phút',currency:'coin'},{id:'black',name:'🕶️ Chợ Đen',refresh:'Mỗi ngày',currency:'gem'},{id:'other',name:'🎁 Khác',refresh:'Theo tài khoản',currency:'coin'}];
function shopState(){const x=u();if(!x.shop||x.shopKey!==getMonthKey()){}return x.shop||null}
function weightedShopRarity(){const pool=[['common',50],['uncommon',35],['rare',15],['epic',5]];const total=pool.reduce((s,p)=>s+p[1],0);let n=Math.random()*total;for(const [id,w] of pool){n-=w;if(n<=0)return id}return 'common'}
function blackRarity(){const pool=[['uncommon',35],['rare',30],['epic',20],['legendary',8],['gold',4],['divine',2],['mythic',.8],['ultimate',.19],['black',.01]];let n=Math.random()*100;for(const [id,w] of pool){n-=w;if(n<=0)return id}return 'uncommon'}
function refreshShop(force=false){const x=u();const now=Date.now();const last=x.shop?.last||0;if(!force&&x.shop?.items&&now-last<30*60*1000)return;const items=[],seen={};for(let i=0;i<7;i++){let item,tries=0;do{const rarity=weightedShopRarity(),type=EQUIP_TYPES.slice(0,5)[Math.floor(Math.random()*5)].id;item=makeEquipment(rarity,type,Math.min(10,Math.max(1,Math.ceil(x.level/30))));tries++}while(seen[item.type+'|'+item.rarity]>=2&&tries<20);const key=item.type+'|'+item.rarity;seen[key]=(seen[key]||0)+1;items.push(item)}x.shop={items,last:now};patchUser({shop:x.shop})}
function refreshBlack(){const x=u(),now=Date.now();if(x.blackShop?.items&&now-(x.blackShop.last||0)<24*60*60*1000)return;let items=[];for(let i=0;i<7;i++){const r=blackRarity(),type=EQUIP_TYPES.slice(0,5)[Math.floor(Math.random()*5)].id;items.push(makeEquipment(r,type,Math.min(10,Math.max(1,Math.ceil(x.level/30)))))}const high=items.filter(i=>['gold','divine','mythic','ultimate'].includes(i.rarity));while(high.length<3){const r=['gold','divine','mythic'][Math.floor(Math.random()*3)],type=EQUIP_TYPES[Math.floor(Math.random()*EQUIP_TYPES.length)].id;const z=makeEquipment(r,type,Math.min(10,Math.max(1,Math.ceil(x.level/30))));items[high.length]=z;high.push(z)}x.blackShop={items,last:now};patchUser({blackShop:x.blackShop})}

}
window.syncNow=syncNow;
function cloudStatus(){return supa?'☁️ Cloud':'⚠️ Local'}
function home(){const x=u(),s=equippedStats(),need=xpNeed(x.level);return `<div class="grid4"><div class="stat">Lv<br><b>${x.level}/300</b></div><div class="stat">HP<br><b>${fmt(s.hp)}</b></div><div class="stat">ATK<br><b>${s.atk}</b></div><div class="stat">DEF<br><b>${s.def}</b></div></div><div class="card" style="margin-top:12px"><div class="sectionTitle"><h2>🎮 Chọn chế độ chơi</h2><span class="tag">Toán & Hóa</span></div><div class="menu"><button onclick="choosePlayType('solo')"><strong>🎯 Chơi đơn</strong><span>Chọn Ải viễn chinh hoặc Boss Thế giới để chơi một mình.</span></button><button onclick="choosePlayType('network')"><strong>🌐 Chơi mạng</strong><span>Tạo/tham gia phòng; sau đó chọn Ải viễn chinh hoặc Boss Thế giới.</span></button><button onclick="chooseScreen('shop')"><strong>🛒 Cửa hàng</strong><span>Trang bị, Chợ Đen, quà tân thủ.</span></button><button onclick="chooseScreen('bag')"><strong>🎒 Túi đồ</strong><span>Trang bị 7 vị trí và xem chỉ số.</span></button><button onclick="chooseScreen('forge')"><strong>⚒️ Tiệm rèn</strong><span>Ghép mảnh vỡ thành đồ hoàn chỉnh.</span></button><button onclick="chooseScreen('pets')"><strong>🐾 Thú cưng</strong><span>Kho pet và 1 pet đang trang bị.</span></button></div></div><div class="card" style="margin-top:12px"><h3>📈 Tiến trình</h3><div class="grid2"><div><b>Toán</b>${DIFFICULTIES.map(d=>`<div class="small" style="margin:5px 0">${d.icon} ${d.name}: ${x.progress.Toán[d.id]}/80</div>`).join('')}</div><div><b>Hóa</b>${DIFFICULTIES.map(d=>`<div class="small" style="margin:5px 0">${d.icon} ${d.name}: ${x.progress.Hóa[d.id]}/80</div>`).join('')}</div></div></div>`}
function header(){const x=u(),need=xpNeed(x.level);return `<div class="top"><div><div class="logo">🧪 Kẻ thách thức Khoa học Tự Nhiên</div><div class="sub">${esc(x.name)} · Level ${x.level} · Tiến trình 300 cấp</div></div><div class="row"><span class="tag">${cloudStatus()}</span><span class="tag">🪙 ${fmt(x.coin)}</span><span class="tag">💎 ${fmt(x.gem)}</span><button class="secondary" onclick="syncNow()">Đồng bộ</button><button class="secondary" onclick="logout()">Đăng xuất</button></div></div><div class="card"><div class="row" style="justify-content:space-between"><span>XP: ${fmt(x.xp)}/${fmt(need)}</span><span class="small">Tên: ${esc(x.name)} ${x.renameUsed?'':' · <button style="padding:4px 7px;font-size:11px" onclick="rename()">Đổi tên 1 lần</button>'}</span></div><div class="progress"><div style="width:${Math.min(100,x.xp/need*100)}%"></div></div></div><div class="nav">${[['home','Trang chủ'],['expedition','Ải viễn chinh'],['world','Boss Thế giới'],['shop','Cửa hàng'],['bag','Túi đồ'],['forge','Tiệm rèn'],['pets','Thú cưng']].map(([k,t])=>`<button class="${state.screen===k?'active':''}" onclick="chooseScreen('${k}')">${t}</button>`).join('')}</div>`}
function authView(){return `<div class="card auth"><div class="logo">🧪 Kẻ thách thức Khoa học Tự Nhiên</div><h1>Đăng nhập Cloud</h1><p class="muted">Tài khoản, cấp độ, vàng, kim cương, vật phẩm, trang bị, thú cưng và tiến trình được đồng bộ trên các thiết bị bằng Supabase Cloud. Phiên đăng nhập được Supabase lưu trong local storage của thiết bị.</p>${CLOUD_CONFIGURED?'':'<div class="notice warning"><b>⚠️ Chưa kết nối Cloud</b><br>Điền <code>SUPABASE_CONFIG.url</code> và <code>SUPABASE_CONFIG.key</code> ở đầu file rồi chạy SQL trong <code>supabase_khtn.sql</code>.</div>'}<div class="grid2"><div><h3>Đăng nhập</h3><div class="field"><label>Tài khoản / Email</label><input id="loginUser" autocomplete="username"></div><div class="field"><label>Mật khẩu</label><input id="loginPw" type="password" autocomplete="current-password"></div><button onclick="login()">Đăng nhập</button></div><div><h3>Tạo tài khoản</h3><div class="field"><label>Email tài khoản</label><input id="regUser" type="email" autocomplete="email"></div><div class="field"><label>Mật khẩu</label><input id="regPw" type="password" autocomplete="new-password"></div><button class="good" onclick="register()">Tạo tài khoản</button></div></div><div class="notice small" style="margin-top:12px">Một thiết bị mới chỉ cần đăng nhập đúng tài khoản. Game sẽ tải bản dữ liệu Cloud mới nhất về máy và lưu cache cục bộ để hỗ trợ chơi ổn định.</div></div>`}
function render(){const app=document.getElementById('app');if(!state.user){app.innerHTML=authView();return}resetWorldIfNeeded();let body='';switch(state.screen){case'home':body=home();break;case'modeSelect':body=modeSelectView();break;case'networkLobby':body=networkLobbyView();break;case'expedition':body=expeditionView();break;case'difficulty':body=difficultyView();break;case'battle':body=expeditionBattleView();break;case'world':body=worldView();break;case'worldBattle':body=worldBattleView();break;case'shop':body=shopView();break;case'bag':body=bagView();break;case'forge':body=forgeView();break;case'pets':body=petsView();break;default:body=home()}app.innerHTML=header()+body;if(roomChannel&&state.room){clearTimeout(window.__roomTrack);window.__roomTrack=setTimeout(async()=>{try{await roomChannel.track(publicPlayerSnapshot());await roomChannel.send({type:'broadcast',event:'player-sync',payload:publicPlayerSnapshot()})}catch(e){}},120)}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveCloudNow()});
window.addEventListener('online',()=>{if(state.user)saveCloudNow()});
bootCloud();
})();
</script>
</body>
</html>
